<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하진이 첫 이유식 도전기!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', 'Segoe UI', sans-serif; background: #f5f6f7; color: #333; }
    .top-bar { background: #03c75a; padding: 12px 24px; display: flex; align-items: center; gap: 10px; }
    .naver-logo { background: white; color: #03c75a; font-weight: 900; font-size: 22px; padding: 2px 10px; border-radius: 6px; letter-spacing: -1px; }
    .top-bar .menu { color: white; font-size: 15px; margin-left: 20px; }
    .article { max-width: 700px; margin: 30px auto; background: white; border-radius: 10px; padding: 40px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .article h1 { font-size: 26px; margin-bottom: 12px; }
    .article .info { color: #aaa; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 16px; margin-bottom: 24px; }
    .big-thumb { width: 100%; height: 260px; background: #e8f9ef; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 90px; margin-bottom: 24px; }
    .article p { font-size: 16px; line-height: 1.9; margin-bottom: 16px; color: #444; }
    .back-btn { display: inline-block; margin-top: 20px; background: #03c75a; color: white; text-decoration: none; padding: 10px 24px; border-radius: 20px; font-weight: bold; }
    .back-btn:hover { background: #02b350; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="naver-logo">NAVER</span>
    <span class="menu">블로그</span>
  </div>

  <div class="article">
    <h1>하진이 첫 이유식 도전기!</h1>
    <div class="info">2026. 9. 9. · 댓글 12 · ♥ 공감 34</div>

    <div class="big-thumb">🍼</div>

    <p>드디어 우리 하진이가 이유식을 시작했어요! 오랫동안 준비해온 순간이라 엄마 아빠 모두 두근두근했답니다.</p>
    <p>첫 숟가락을 입에 넣는 순간 하진이의 표정이란... 오만가지 표정을 다 짓는 모습에 온 가족이 웃음바다가 됐어요. 😆</p>
    <p>처음엔 낯설어하더니 몇 번 먹여주니까 곧잘 받아먹더라고요. 앞으로 하진이가 얼마나 잘 먹고 무럭무럭 자랄지 정말 기대돼요!</p>

    <a href="index.html" class="back-btn">← 목록으로</a>
  </div>

</body>
</html>
