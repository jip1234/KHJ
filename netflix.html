<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAJIN & HAJUN FLIX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #141414;
      color: #fff;
    }

    /* 상단 바 */
    header {
      display: flex;
      align-items: center;
      padding: 18px 40px;
      position: sticky;
      top: 0;
      background: linear-gradient(#141414, rgba(20,20,20,0.6), transparent);
      z-index: 10;
    }
    .logo {
      color: #e50914;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .nav {
      display: flex;
      gap: 20px;
      margin-left: 40px;
      font-size: 14px;
    }
    .nav span { cursor: pointer; color: #e5e5e5; }
    .nav span:hover { color: #b3b3b3; }

    /* 메인 히어로 배너 */
    .hero {
      height: 480px;
      background: linear-gradient(to top, #141414 5%, transparent 50%),
                  linear-gradient(120deg, #5a1a1a, #b81d24, #2a0a0a);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      position: relative;
    }
    .hero .baby-emoji {
      position: absolute;
      right: 8%;
      top: 50%;
      transform: translateY(-50%);
      font-size: 220px;
      opacity: 0.85;
    }
    .hero h1 {
      font-size: 60px;
      margin-bottom: 16px;
      max-width: 600px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    .hero p {
      font-size: 18px;
      max-width: 500px;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #ddd;
    }
    .hero .buttons { display: flex; gap: 14px; }
    .btn {
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-play { background: #fff; color: #000; }
    .btn-play:hover { background: #d9d9d9; }
    .btn-info { background: rgba(109,109,110,0.7); color: #fff; }
    .btn-info:hover { background: rgba(109,109,110,0.5); }

    /* 카테고리 줄 */
    .row {
      padding: 20px 40px;
    }
    .row h2 {
      font-size: 22px;
      margin-bottom: 14px;
    }
    .row-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .thumb {
      min-width: 240px;
      height: 135px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      cursor: pointer;
      transition: transform 0.25s;
      position: relative;
    }
    .thumb:hover { transform: scale(1.08); z-index: 2; }
    .thumb .label {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 1px 1px 3px #000;
    }
    .c1 { background: linear-gradient(135deg, #e50914, #6a040f); }
    .c2 { background: linear-gradient(135deg, #b5179e, #560bad); }
    .c3 { background: linear-gradient(135deg, #f77f00, #d62828); }
    .c4 { background: linear-gradient(135deg, #0077b6, #023e8a); }
    .c5 { background: linear-gradient(135deg, #2d6a4f, #081c15); }
    .c6 { background: linear-gradient(135deg, #ff006e, #8338ec); }

    footer {
      padding: 30px 40px;
      color: #808080;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- 상단 바 -->
  <header>
    <span class="logo">HAJINFLIX</span>
    <div class="nav">
      <span>홈</span>
      <span>성장기록</span>
      <span>나들이</span>
      <span>이유식</span>
      <span>내가 찜한 콘텐츠</span>
    </div>
  </header>

  <!-- 히어로 배너 -->
  <div class="hero">
    <span class="baby-emoji">👶</span>
    <h1>하진 &amp; 하준</h1>
    <p>두 아이의 좌충우돌 성장 스토리. 매일매일이 새로운 에피소드! 지금 바로 시청하세요.</p>
    <div class="buttons">
      <button class="btn btn-play">▶ 재생</button>
      <button class="btn btn-info">ⓘ 상세 정보</button>
    </div>
  </div>

  <!-- 인기 콘텐츠 줄 -->
  <div class="row">
    <h2>지금 뜨는 콘텐츠 🔥</h2>
    <div class="row-scroll">
      <div class="thumb c1">🍼<span class="label">첫 이유식 도전기</span></div>
      <div class="thumb c2">🎠<span class="label">놀이터 대모험</span></div>
      <div class="thumb c3">🛁<span class="label">첨벙첨벙 목욕 타임</span></div>
      <div class="thumb c4">🎂<span class="label">하진이 100일 파티</span></div>
      <div class="thumb c5">🧸<span class="label">곰돌이와 낮잠</span></div>
      <div class="thumb c6">🎈<span class="label">생애 첫 나들이</span></div>
    </div>
  </div>

  <!-- 두 번째 줄 -->
  <div class="row">
    <h2>하진이가 좋아하는 순간들 💕</h2>
    <div class="row-scroll">
      <div class="thumb c3">😴<span class="label">쌔근쌔근 꿀잠</span></div>
      <div class="thumb c6">😄<span class="label">까르르 웃음 대잔치</span></div>
      <div class="thumb c1">🍚<span class="label">밥심 폭발</span></div>
      <div class="thumb c4">🚼<span class="label">아장아장 첫 걸음</span></div>
      <div class="thumb c2">🎵<span class="label">동요 부르기</span></div>
      <div class="thumb c5">🐾<span class="label">강아지랑 친구먹기</span></div>
    </div>
  </div>

  <footer>
    © 2026 HAJINFLIX · 하진 &amp; 하준 패밀리 스트리밍
  </footer>

</body>
</html>
